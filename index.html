<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="theme-color" content="#f6f7f1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Claire's Kitchen"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Claire's Kitchen</title>
<style>
  :root{
    --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#F9F9FB; --surface3:#EFEFF2;
    --text:#1C1C1E; --text2:#6E6E73; --text3:#AEAEB2;
    --accent:#FF9500; --accent-ink:#7A3E00; --green:#34C759; --red:#FF3B30; --blue:#0A84FF; --purple:#AF52DE;
    --divider:rgba(60,60,67,0.29);
    --shadow: 0 1px 2px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.08);
    --shadow-lg: 0 4px 10px rgba(0,0,0,0.08), 0 20px 48px rgba(0,0,0,0.14);
    --radius-lg:26px; --radius-md:18px; --radius-sm:12px;
    --spring: cubic-bezier(.32,1.55,.55,1);
    --ease: cubic-bezier(.4,0,.2,1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --surface3:#3A3A3C;
      --text:#F2F2F7; --text2:#98989D; --text3:#636366;
      --accent:#FF9F0A; --accent-ink:#FFD9A0; --divider:rgba(84,84,88,0.6);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.45);
      --shadow-lg: 0 4px 10px rgba(0,0,0,0.35), 0 20px 48px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --surface3:#3A3A3C;
    --text:#F2F2F7; --text2:#98989D; --text3:#636366;
    --accent:#FF9F0A; --accent-ink:#FFD9A0; --divider:rgba(84,84,88,0.6);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.45);
    --shadow-lg: 0 4px 10px rgba(0,0,0,0.35), 0 20px 48px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
  input{font-family:inherit;}
  ::selection{background:var(--accent); color:#fff;}

  #app{max-width:640px; margin:0 auto; min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom,0px)); position:relative;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter:blur(20px) saturate(1.6); backdrop-filter:blur(20px) saturate(1.6);
    border-bottom:0.5px solid transparent;
    transition:border-color .25s var(--ease);
  }
  .topbar.scrolled{border-bottom-color:var(--divider);}
  .topbar-row{display:flex; align-items:center; justify-content:space-between; min-height:36px; gap:12px;}
  .large-title{font-size:34px; font-weight:800; letter-spacing:-0.4px; padding:2px 2px 6px; text-wrap:balance;}
  .back-btn{display:flex; align-items:center; gap:2px; font-size:17px; color:var(--accent); font-weight:500; padding:6px 4px 6px 0; margin-left:-6px;}
  .back-btn svg{width:11px;height:19px;}
  .icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2); transition:transform .15s var(--spring), background .15s;}
  .icon-btn:active{transform:scale(0.88); background:var(--surface3);}

  /* ---------- Segmented / chips ---------- */
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding:2px 20px 14px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex:none; padding:8px 16px; border-radius:100px; font-size:14.5px; font-weight:600;
    background:var(--surface2); color:var(--text2); border:0.5px solid var(--divider);
    transition:transform .12s var(--spring), background .18s, color .18s;
    white-space:nowrap;
  }
  .cat-chip:active{transform:scale(0.94);}
  .cat-chip.active{background:var(--text); color:var(--bg); border-color:transparent;}

  /* ---------- Search field ---------- */
  .search-wrap{padding:0 20px 12px;}
  .search-field{
    display:flex; align-items:center; gap:8px; background:var(--surface2); border-radius:12px;
    padding:9px 12px; border:0.5px solid transparent;
  }
  .search-field svg{width:16px;height:16px;flex:none;color:var(--text3);}
  .search-field input{flex:1; background:none; border:none; outline:none; font-size:16px; color:var(--text); min-width:0;}
  .search-field input::placeholder{color:var(--text3);}
  .search-clear{color:var(--text3); font-size:15px; padding:2px 4px;}

  /* ---------- Recipe grid ---------- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:4px 20px 28px;}
  .rcard{
    background:var(--surface); border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow);
    transition:transform .22s var(--spring), box-shadow .22s var(--ease);
    display:flex; flex-direction:column;
  }
  .rcard:active{transform:scale(0.96); box-shadow:var(--shadow);}
  .rphoto{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:44px; position:relative; overflow:hidden;}
  .rphoto img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .rphoto .servesbadge{position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.38); color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:100px; backdrop-filter:blur(6px);}
  .rbody{padding:10px 12px 13px;}
  .rname{font-size:15px; font-weight:700; line-height:1.25; margin-bottom:5px; text-wrap:balance;}
  .rtags{display:flex; flex-wrap:wrap; gap:4px;}
  .rtag{font-size:10.5px; font-weight:700; color:var(--text2); background:var(--surface2); padding:2.5px 7px; border-radius:100px; letter-spacing:0.1px;}

  .empty-state{padding:60px 30px; text-align:center; color:var(--text2);}
  .empty-state .emoji{font-size:44px; margin-bottom:10px; display:block;}
  .empty-state h3{font-size:19px; color:var(--text); margin-bottom:6px; font-weight:700;}
  .empty-state p{font-size:15px; line-height:1.4;}

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:50; max-width:640px; margin:0 auto;
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb, var(--surface) 78%, transparent);
    -webkit-backdrop-filter:blur(22px) saturate(1.7); backdrop-filter:blur(22px) saturate(1.7);
    border-top:0.5px solid var(--divider);
  }
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 2px; color:var(--text3); transition:color .15s, transform .15s var(--spring);}
  .tab svg{width:25px;height:25px;}
  .tab span{font-size:10.5px; font-weight:600;}
  .tab.active{color:var(--accent);}
  .tab:active{transform:scale(0.9);}
  .tab .badge{position:relative;}
  .tab .badge em{position:absolute; top:-3px; right:-9px; background:var(--red); color:#fff; font-size:9.5px; font-weight:800; font-style:normal; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; box-shadow:0 0 0 2px var(--surface);}

  /* ---------- Recipe detail ---------- */
  .hero{
    aspect-ratio:4/3; display:flex; align-items:flex-end; justify-content:center; position:relative; padding:26px 20px;
    overflow:hidden;
  }
  .hero .bigemoji{font-size:88px; filter:drop-shadow(0 8px 20px rgba(0,0,0,0.18));}
  .hero-photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;}
  .hero-fab{position:absolute; z-index:2; width:38px;height:38px;border-radius:50%; background:rgba(0,0,0,0.32); backdrop-filter:blur(10px); display:flex;align-items:center;justify-content:center; color:#fff; transition:transform .15s var(--spring);}
  .hero-fab svg{width:17px;height:17px;display:block;flex:none;}
  .hero-fab.back svg{width:11px;height:17px;margin-right:1px;}
  .hero-fab:active{transform:scale(0.88);}
  .hero-fab.back{top:calc(16px + env(safe-area-inset-top,0px)); left:16px;}
  .hero-fab.plan{top:calc(16px + env(safe-area-inset-top,0px)); right:16px;}
  .hero-fab.plan.added{background:var(--accent);}

  .detail-body{padding:20px 20px 40px;}
  .detail-title{font-size:29px; font-weight:800; letter-spacing:-0.4px; margin-bottom:8px; text-wrap:balance;}
  .detail-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
  .dtag{font-size:12px; font-weight:700; padding:4px 11px; border-radius:100px; background:var(--surface2); color:var(--text2);}
  .source-wrap{margin-top:8px; padding:0 2px; text-align:center;}
  .source-link{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--text3); font-weight:500; padding:4px 0; letter-spacing:0.1px; transition:color .15s;}
  .source-link:active{color:var(--accent);}
  .source-link svg{flex:none; width:12px; height:12px; opacity:0.8;}

  .servings-card{
    display:flex; align-items:center; justify-content:space-between; background:var(--surface); border-radius:var(--radius-md);
    padding:14px 16px; box-shadow:var(--shadow); margin-bottom:22px;
  }
  .servings-label{font-size:15px; font-weight:600; color:var(--text2);}
  .servings-label b{display:block; font-size:20px; font-weight:800; color:var(--text); margin-top:1px;}
  .stepper{display:flex; align-items:center; gap:0; background:var(--surface2); border-radius:100px; padding:3px;}
  .stepper button{width:32px;height:32px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:19px; font-weight:600; color:var(--accent); transition:transform .12s var(--spring), background .15s;}
  .stepper button:active{transform:scale(0.85); background:var(--surface3);}
  .stepper button:disabled{opacity:0.3;}
  .stepper .sval{width:34px; text-align:center; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums;}

  .section-block{margin-bottom:20px;}
  .section-toggle{display:flex; align-items:center; justify-content:space-between; padding:4px 2px 12px; cursor:pointer;}
  .section-toggle h3{font-size:20px; font-weight:800; letter-spacing:-0.2px;}
  .section-toggle .chev{width:20px;height:20px; color:var(--text3); transition:transform .28s var(--spring);}
  .section-toggle.collapsed .chev{transform:rotate(-90deg);}
  .section-content{overflow:hidden; transition:grid-template-rows .32s var(--ease); display:grid; grid-template-rows:1fr;}
  .section-content.collapsed{grid-template-rows:0fr;}
  .section-content > div{overflow:hidden; min-height:0;}

  h4.subhead{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:var(--text3); margin:0 0 8px 2px;}

  .ing-list{background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--shadow); overflow:hidden; margin-bottom:18px;}
  .ing-row{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:0.5px solid var(--divider);}
  .ing-row:last-child{border-bottom:none;}
  .ing-amt{font-size:15px; font-weight:700; color:var(--accent-ink,var(--accent)); min-width:64px; font-variant-numeric:tabular-nums;}
  .ing-name{font-size:16px; color:var(--text); flex:1;}

  .steps-list{counter-reset:step; display:flex; flex-direction:column; gap:14px;}
  .step-card{background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--shadow); padding:16px 16px 17px;}
  .step-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .step-num{counter-increment:step; width:26px;height:26px;border-radius:50%; background:var(--accent); color:#fff; font-size:13px; font-weight:800; display:flex;align-items:center;justify-content:center; flex:none;}
  .step-num::before{content:counter(step);}
  .step-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .step-chip{font-size:12.5px; font-weight:700; padding:4px 9px; border-radius:100px; background:var(--surface2); color:var(--text2); white-space:nowrap;}
  .step-chip b{color:var(--text); font-weight:800;}
  .step-text{font-size:16px; line-height:1.48; color:var(--text);}

  .tip-card{background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--surface)), var(--surface)); border:1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius:var(--radius-md); padding:16px; margin-top:6px; display:flex; gap:10px;}
  .tip-card .tico{font-size:20px;}
  .tip-card p{font-size:15px; line-height:1.45; color:var(--text);}
  .tip-card strong{display:block; font-size:12.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--accent-ink,var(--accent)); margin-bottom:3px;}

  .pairs-section{margin-top:22px;}
  .pairs-row{display:flex; gap:12px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none;}
  .pairs-row::-webkit-scrollbar{display:none;}
  .pair-card{flex:none; width:118px; background:var(--surface); border-radius:var(--radius-sm); box-shadow:var(--shadow); overflow:hidden; transition:transform .15s var(--spring);}
  .pair-card:active{transform:scale(0.94);}
  .pair-photo{height:80px; display:flex;align-items:center;justify-content:center; font-size:30px; overflow:hidden; position:relative;}
  .pair-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .pair-name{font-size:12.5px; font-weight:700; padding:8px 9px 10px; line-height:1.25;}

  /* ---------- Ingredient search ---------- */
  .chips-input-wrap{
    background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--shadow); padding:12px 14px; margin:0 20px 16px;
  }
  .chips-input-wrap .hint{font-size:12.5px; color:var(--text3); margin-bottom:10px; font-weight:500;}
  .chips-flex{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .ing-chip{display:flex; align-items:center; gap:6px; background:var(--accent); color:#fff; font-size:14px; font-weight:700; padding:7px 8px 7px 13px; border-radius:100px;}
  .ing-chip .num{background:rgba(255,255,255,0.3); width:16px;height:16px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center; font-weight:800;}
  .ing-chip button{color:#fff; display:flex; width:18px;height:18px; align-items:center;justify-content:center; opacity:0.85;}
  .chip-input{flex:1; min-width:90px; border:none; outline:none; background:none; font-size:16px; padding:6px 2px; color:var(--text);}

  .match-list{padding:0 20px;}
  .match-card{display:flex; gap:13px; align-items:center; background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--shadow); padding:11px; margin-bottom:12px; transition:transform .15s var(--spring);}
  .match-card:active{transform:scale(0.97);}
  .match-photo{width:60px;height:60px;border-radius:14px; display:flex;align-items:center;justify-content:center; font-size:26px; flex:none; overflow:hidden; position:relative;}
  .match-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .match-info{flex:1; min-width:0;}
  .match-name{font-size:16px; font-weight:700; margin-bottom:3px;}
  .match-sub{font-size:12.5px; color:var(--text2); line-height:1.4;}
  .match-sub b{color:var(--green); font-weight:700;}
  .match-score{flex:none; text-align:center;}
  .match-score .n{font-size:17px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums;}
  .match-score .lbl{font-size:9.5px; color:var(--text3); font-weight:700; text-transform:uppercase;}

  /* ---------- Meal plan ---------- */
  .plan-list{padding:4px 20px 30px; display:flex; flex-direction:column; gap:12px;}
  .plan-item{
    display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--shadow);
    padding:10px 12px; touch-action:pan-y; position:relative;
  }
  .plan-item.dragging{box-shadow:var(--shadow-lg); z-index:5; transform:scale(1.03); opacity:0.97;}
  .plan-item.drop-target::before{content:''; position:absolute; left:8px; right:8px; top:-7px; height:3px; background:var(--accent); border-radius:2px;}
  .plan-daynum{width:30px;height:30px;border-radius:50%; background:var(--surface2); color:var(--text2); font-weight:800; font-size:14px; display:flex;align-items:center;justify-content:center; flex:none;}
  .plan-photo{width:48px;height:48px;border-radius:12px; display:flex;align-items:center;justify-content:center; font-size:22px; flex:none; overflow:hidden; position:relative;}
  .plan-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .plan-info{flex:1; min-width:0;}
  .plan-name{font-size:15.5px; font-weight:700; margin-bottom:2px;}
  .plan-sub{font-size:12px; color:var(--text2);}
  .drag-handle{color:var(--text3); padding:8px; cursor:grab; touch-action:none;}
  .drag-handle svg{width:20px;height:20px;}
  .plan-remove{color:var(--text3); padding:6px;}

  .fab-clear{display:block; margin:6px auto 0; font-size:14px; font-weight:700; color:var(--red); padding:10px 18px;}

  /* ---------- Temporary edit mode ---------- */
  .edit-toolbar{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .edit-btn{font-size:13.5px; font-weight:700; padding:8px 14px; border-radius:100px; background:var(--surface2); color:var(--text2); display:flex; align-items:center; gap:6px; transition:transform .12s var(--spring);}
  .edit-btn:active{transform:scale(0.95);}
  .edit-btn.primary{background:var(--accent); color:#fff;}
  .edit-btn.danger{color:var(--red);}
  .edit-btn svg{width:14px;height:14px;}
  .draft-banner{display:flex; align-items:center; justify-content:space-between; gap:10px; background:color-mix(in srgb, var(--accent) 14%, var(--surface)); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:16px; font-size:13px; color:var(--accent-ink,var(--accent)); font-weight:600;}
  .draft-banner button{text-decoration:underline; font-weight:700; flex:none;}
  .edit-field{width:100%; border:1px solid var(--divider); border-radius:10px; padding:9px 11px; font-size:15px; background:var(--surface); color:var(--text); font-family:inherit;}
  .edit-title-input{font-size:24px; font-weight:800; margin-bottom:14px;}
  .edit-ing-row{display:flex; gap:6px; margin-bottom:8px; align-items:center;}
  .ei-amt{width:52px; flex:none;}
  .ei-rangemax{width:52px; flex:none;}
  .ei-unit{width:64px; flex:none;}
  .ei-name{flex:1; min-width:0;}
  .edit-row-remove{color:var(--text3); padding:6px; flex:none; display:flex;align-items:center;justify-content:center;}
  .edit-row-remove svg{width:16px;height:16px;}
  .edit-add-btn{font-size:13.5px; font-weight:700; color:var(--accent); padding:8px 2px; margin-bottom:14px;}
  .edit-step-row{display:flex; gap:8px; margin-bottom:10px; align-items:flex-start;}
  .edit-step-row textarea{flex:1; min-height:64px; resize:vertical;}
  .edit-tips-area{min-height:54px; resize:vertical;}
  .edit-hint{font-size:12px; color:var(--text3); margin:-6px 0 14px 2px;}

  @media (max-width:380px){
    .grid{gap:12px; padding:4px 14px 24px;}
    .large-title{font-size:29px;}
  }
</style>

<script>
(function(){
"use strict";

/* ============================ DATA ============================ */

const CATEGORIES = ["Dishes","Sides","Salad","Soup","Breakkie","Sweets","Drinks"];

const CAT_STYLE = {
  Dishes:  {grad:["#FF9F0A","#FF3B30"], emoji:"🍽️"},
  Sides:   {grad:["#32ADE6","#34C759"], emoji:"🥔"},
  Salad:   {grad:["#8BC34A","#34C759"], emoji:"🥬"},
  Soup:    {grad:["#FFCC00","#FF9500"], emoji:"🍲"},
  Breakkie:{grad:["#FFD60A","#FF9F0A"], emoji:"🍳"},
  Sweets:  {grad:["#FF2D55","#AF52DE"], emoji:"🍰"},
  Drinks:  {grad:["#5AC8FA","#0A84FF"], emoji:"🥤"},

/* ============================ STATE ============================ */

const State = {
  tab:"home",           // home | search | plan
  category:"All",
  homeQuery:"",
  recipeId:null,
  ingChips:[],           // array of strings, in typed order
  mealPlan:[],            // array of recipe ids
  servingsOverride:{},    // recipeId -> current servings number
  collapsedSections:{},   // recipeId -> Set of section index collapsed
  edits:{},               // recipeId -> draft object (local-only, temporary edit tool)
  editing:null,           // recipeId currently in edit mode, or null
};

function loadPersisted(){
  try{
    const raw = localStorage.getItem("ck_state_v1");
    if(raw){
      const p = JSON.parse(raw);
      if(Array.isArray(p.mealPlan)) State.mealPlan = p.mealPlan.filter(id=>RECIPES.some(r=>r.id===id));
      if(p.servingsOverride) State.servingsOverride = p.servingsOverride;
    }
    const rawEdits = localStorage.getItem("ck_edits_v1");
    if(rawEdits){
      const e = JSON.parse(rawEdits);
      if(e && typeof e==="object") State.edits = e;
    }
  }catch(e){}
}
function persist(){
  try{
    localStorage.setItem("ck_state_v1", JSON.stringify({mealPlan:State.mealPlan, servingsOverride:State.servingsOverride}));
  }catch(e){}
}
function persistEdits(){
  try{
    localStorage.setItem("ck_edits_v1", JSON.stringify(State.edits));
  }catch(e){}
}
loadPersisted();

function findRecipe(id){ return RECIPES.find(r=>r.id===id); }

/* ---- Temporary edit-mode helpers (local-only drafts, not saved to Claude) ---- */

function cloneForEdit(r){
  return {
    title: r.title,
    tips: r.tips || "",
    sections: r.sections.map(s=>({
      title: s.title || null,
      ingredients: s.ingredients.map(i=>({name:i.name, amount:i.amount, unit:i.unit, rangeMax:i.rangeMax||null})),
      steps: s.steps.map(st=>({text:st.text})),
    })),
  };
}

function getEffectiveRecipe(id){
  const base = findRecipe(id);
  if(!base) return base;
  const draft = State.edits[id];
  if(!draft) return base;
  return Object.assign({}, base, {
    title: draft.title,
    tips: draft.tips,
    sections: draft.sections.map(s=>({
      title: s.title || null,
      ingredients: s.ingredients.map(i=>ing(i.name, i.amount, i.unit, i.rangeMax||undefined)),
      steps: s.steps.map(st=>({text:st.text, uses:[]})),
    })),
  });
}

function draftSummaryText(id){
  const d = State.edits[id];
  if(!d) return "";
  const lines = [];
  lines.push(d.title);
  d.sections.forEach(s=>{
    if(s.title) lines.push("\n"+s.title+":");
    lines.push("\nIngredients:");
    s.ingredients.forEach(i=>{
      let amt;
      if(i.unit==="pinch") amt="pinch";
      else if(i.unit==="optional") amt="optional";
      else if(i.unit==="to taste" || !i.amount) amt="to taste";
      else if(i.rangeMax) amt=`${i.amount}-${i.rangeMax} ${i.unit}`;
      else amt=`${i.amount} ${i.unit}`;
      lines.push(`- ${amt} ${i.name}`.replace(/\s+/g," ").trim());
    });
    lines.push("\nSteps:");
    s.steps.forEach((st,idx)=>lines.push(`${idx+1}. ${st.text}`));
  });
  if(d.tips) lines.push("\nTips: "+d.tips);
  return lines.join("\n");
}

/* ============================ HELPERS ============================ */

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function fmtNum(v){
  if(v<=0) return "";
  if(Math.abs(v-Math.round(v))<0.02) return String(Math.round(v));
  const whole = Math.floor(v);
  const frac = v-whole;
  const table = [[1/8,"⅛"],[1/4,"¼"],[1/3,"⅓"],[3/8,"⅜"],[1/2,"½"],[5/8,"⅝"],[2/3,"⅔"],[3/4,"¾"],[7/8,"⅞"]];
  let best=null,bd=0.045;
  for(const [f,s] of table){ const d=Math.abs(frac-f); if(d<bd){bd=d;best=s;} }
  if(best) return (whole>0?whole+" ":"")+best;
  return (Math.round(v*10)/10).toString();
}

function scaledAmount(amount, ratio){
  if(!amount || amount<=0) return null;
  return fmtNum(amount*ratio);
}

function ingDisplay(i, ratio){
  const v = scaledAmount(i.amount, ratio);
  if(v===null){
    return `<span class="ing-amt">${i.unit==="pinch"?"Pinch":i.unit==="optional"?"Optional":"To taste"}</span><span class="ing-name">${esc(i.name)}</span>`;
  }
  const unitLabel = i.unit==="whole"||i.unit==="clove"||i.unit==="cookies" ? "" : " "+i.unit;
  if(i.rangeMax){
    const v2 = scaledAmount(i.rangeMax, ratio);
    const wholeUnit2 = i.unit==="whole" ? "" : i.unit==="clove" ? (i.rangeMax*ratio===1?" clove":" cloves") : "";
    return `<span class="ing-amt">${v}–${v2}${esc(unitLabel)}${wholeUnit2}</span><span class="ing-name">${esc(i.name)}</span>`;
  }
  const wholeUnit = i.unit==="whole" ? "" : i.unit==="clove" ? (i.amount*ratio===1?" clove":" cloves") : "";
  return `<span class="ing-amt">${v}${esc(unitLabel)}${wholeUnit}</span><span class="ing-name">${esc(i.name)}</span>`;
}

function stepChipDisplay(name, recipe, ratio){
  const ingr = recipe.sections.flatMap(s=>s.ingredients).find(x=>x.name===name);
  if(!ingr) return "";
  const v = scaledAmount(ingr.amount, ratio);
  let amt;
  if(v===null){
    amt = ingr.unit==="pinch"?"pinch":ingr.unit==="optional"?"optional":"to taste";
  } else if(ingr.rangeMax){
    const v2 = scaledAmount(ingr.rangeMax, ratio);
    amt = `${v}–${v2}${ingr.unit==="whole"||ingr.unit==="clove"?"":" "+ingr.unit}`;
  } else {
    amt = `${v}${ingr.unit==="whole"||ingr.unit==="clove"?"":" "+ingr.unit}`;
  }
  return `<span class="step-chip">${esc(amt)} <b>${esc(ingr.name)}</b></span>`;
}

function prettySourceLabel(url){
  try{
    const u = new URL(url);
    let host = u.hostname.replace(/^www\./,"");
    if(host==="instagram.com") return "View on Instagram";
    return host;
  }catch(e){ return url; }
}

function gradCss(cat){
  const st = CAT_STYLE[cat] || CAT_STYLE.Dishes;
  return `linear-gradient(135deg, ${st.grad[0]}, ${st.grad[1]})`;
}
function primaryCat(r){ return r.tags[0]; }

/* ============================ HOME VIEW ============================ */

function renderHomeView(){
  const cats = ["All", ...CATEGORIES];
  let list = RECIPES.slice();
  if(State.category!=="All") list = list.filter(r=>r.tags.includes(State.category));
  if(State.homeQuery.trim()){
    const q = State.homeQuery.trim().toLowerCase();
    list = list.filter(r=>r.title.toLowerCase().includes(q));
  }

  const chipHtml = cats.map(c=>`<button class="cat-chip ${State.category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");

  const cardsHtml = list.length ? list.map(r=>{
    const st = CAT_STYLE[primaryCat(r)];
    return `
    <a class="rcard" data-recipe="${r.id}">
      <div class="rphoto" style="background:${gradCss(primaryCat(r))}">
        ${r.photo ? `<img src="${esc(r.photo)}" alt="${esc(r.title)}" loading="lazy">` : `<span>${r.emoji}</span>`}

    <div class="chip-row">${chipHtml}</div>

      <div class="search-field">
        ${ICONS.search}
        <input id="home-search" type="text" placeholder="Search recipes" value="${esc(State.homeQuery)}">
        ${State.homeQuery? `<button class="search-clear" id="home-search-clear">${ICONS.x}</button>` : ""}
      </div>

  viewEl.querySelectorAll(".cat-chip").forEach(b=>b.addEventListener("click", ()=>{ State.category=b.dataset.cat; renderHomeView(); }));

/* ============================ RECIPE DETAIL ============================ */

function openRecipe(id){
  State.recipeId = id;
  State.tab = "detail";
  State.editing = null;
  if(!(id in State.collapsedSections)) State.collapsedSections[id] = new Set();
  render();
}

function renderDetailView(){
  const rawBase = findRecipe(State.recipeId);
  if(!rawBase){ State.tab="home"; render(); return; }
  const r = getEffectiveRecipe(State.recipeId);
  const isEditing = State.editing === r.id;
  const hasDraft = !!State.edits[r.id];
  const base = r.servings;
  const current = State.servingsOverride[r.id] || base;
  const ratio = current/base;
  const inPlan = State.mealPlan.includes(r.id);

  const sectionsHtml = r.sections.map((sec, idx)=>{
    const collapsed = State.collapsedSections[r.id] && State.collapsedSections[r.id].has(idx);
    const ingHtml = sec.ingredients.map(i=>`<div class="ing-row">${ingDisplay(i, ratio)}</div>`).join("");
    const stepsHtml = sec.steps.map(st=>{
      const chips = st.uses.map(name=>stepChipDisplay(name, r, ratio)).join("");
      return `<div class="step-card">
        <div class="step-head"><div class="step-num"></div></div>
        ${chips?`<div class="step-chips">${chips}</div>`:""}
        <div class="step-text">${esc(st.text)}</div>
      </div>`;
    }).join("");
    const header = sec.title ? `
      <div class="section-toggle ${collapsed?'collapsed':''}" data-toggle="${idx}">
        <h3>${esc(sec.title)}</h3>
        <span class="chev">${ICONS.chev}</span>
      </div>` : (r.sections.length>1 ? "" : "");
    return `
      <div class="section-block">
        ${header}
        <div class="section-content ${collapsed?'collapsed':''}" id="sec-content-${idx}">
          <div>
            <h4 class="subhead">Ingredients</h4>
            <div class="ing-list">${ingHtml}</div>
            <h4 class="subhead">Method</h4>
            <div class="steps-list">${stepsHtml}</div>
          </div>
        </div>
      </div>`;
  }).join("");

  const pairs = (r.pairsWith||[]).map(id=>findRecipe(id)).filter(Boolean);
  const pairsHtml = pairs.length ? `
    <div class="pairs-section">
      <h4 class="subhead">Pairs well with</h4>
      <div class="pairs-row">
      ${pairs.map(p=>`
        <a class="pair-card" data-recipe="${p.id}">
          <div class="pair-photo" style="background:${gradCss(primaryCat(p))}">${p.photo?`<img src="${esc(p.photo)}" alt="${esc(p.title)}">`:p.emoji}</div>
          <div class="pair-name">${esc(p.title)}</div>
        </a>`).join("")}
      </div>
    </div>` : "";

  const tipHtml = r.tips ? `
    <div class="tip-card">
      <div class="tico">💡</div>
      <p><strong>Serving tip</strong>${esc(r.tips)}</p>
    </div>` : "";

  const sourceLinks = r.source ? (Array.isArray(r.source) ? r.source : [r.source]) : [];
  const sourceHtml = sourceLinks.length ? `
    <div class="source-wrap">
      ${sourceLinks.map(u=>`<a class="source-link" href="${esc(u)}" target="_blank" rel="noopener">${ICONS.link} ${esc(prettySourceLabel(u))}</a>`).join("<br>")}
    </div>` : "";

  const draftBannerHtml = (hasDraft && !isEditing) ? `
    <div class="draft-banner">
      <span>You've got unsaved local edits on this recipe.</span>
      <button id="draft-discard">Discard</button>
    </div>` : "";

  const editToolbarHtml = "";

  const bodyMainHtml = isEditing ? editFormHtml(r) : `
      ${sectionsHtml}
      ${tipHtml}
      ${sourceHtml}
  `;

  viewEl.innerHTML = `
    <div class="hero" style="background:${gradCss(primaryCat(r))}">
      <button class="hero-fab back" id="detail-back">${ICONS.back}</button>
      ${!isEditing ? `<button class="hero-fab plan ${inPlan?'added':''}" id="detail-plan-toggle">${inPlan?ICONS.check:ICONS.plus}</button>` : ""}
      ${r.photo ? `<img class="hero-photo" src="${esc(r.photo)}" alt="${esc(r.title)}">` : `<span class="bigemoji">${r.emoji}</span>`}
    </div>
    <div class="detail-body">
      ${isEditing ? "" : `<div class="detail-title">${esc(r.title)}</div>
      <div class="detail-tags">${r.tags.map(t=>`<span class="dtag">${esc(t)}</span>`).join("")}</div>`}
      ${draftBannerHtml}
      ${editToolbarHtml}
      ${isEditing ? "" : `<div class="servings-card">
        <div class="servings-label">Servings<b>${current} ${r.servingsUnit==='servings'?(current===1?'serving':'servings'):r.servingsUnit}</b></div>
        <div class="stepper">
          <button id="serv-minus" ${current<=1?"disabled":""}>–</button>
          <span class="sval">${current}</span>
          <button id="serv-plus">+</button>
        </div>
      </div>`}
      ${bodyMainHtml}
    </div>
  `;

  document.getElementById("detail-back").addEventListener("click", ()=>{
    if(isEditing){ State.editing=null; }
    State.tab="home"; render();
  });

  const editToggleBtn = document.getElementById("edit-toggle");
  if(editToggleBtn){
    editToggleBtn.addEventListener("click", ()=>{
      if(!State.edits[r.id]) State.edits[r.id] = cloneForEdit(getEffectiveRecipe(r.id));
      State.editing = r.id;
      renderDetailView();
    });
  }
  const draftDiscardBtn = document.getElementById("draft-discard");
  if(draftDiscardBtn){
    draftDiscardBtn.addEventListener("click", ()=>{
      delete State.edits[r.id];
      persistEdits();
      renderDetailView();
    });
  }

  if(isEditing){
    bindEditFormEvents(r);
    window.onscroll = null;
    return;
  }

  document.getElementById("detail-plan-toggle").addEventListener("click", ()=>{ toggleMealPlan(r.id); renderDetailView(); });

  document.getElementById("serv-minus").addEventListener("click", ()=>{
    const c = State.servingsOverride[r.id] || base;
    if(c>1){ State.servingsOverride[r.id]=c-1; persist(); renderDetailView(); }
  });
  document.getElementById("serv-plus").addEventListener("click", ()=>{
    const c = State.servingsOverride[r.id] || base;
    State.servingsOverride[r.id]=c+1; persist(); renderDetailView();
  });

  viewEl.querySelectorAll("[data-toggle]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const idx = parseInt(el.dataset.toggle,10);
      const set = State.collapsedSections[r.id];
      if(set.has(idx)) set.delete(idx); else set.add(idx);
      renderDetailView();
    });
  });

  viewEl.querySelectorAll(".pair-card").forEach(el=>el.addEventListener("click", ()=>openRecipe(el.dataset.recipe)));

  window.onscroll = null;
}

  viewEl.querySelectorAll(".edit-ing-row input").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const row = inp.closest(".edit-ing-row");
      const sIdx = parseInt(row.dataset.sidx,10), iIdx = parseInt(row.dataset.iidx,10);
      const field = inp.dataset.field;
      const ingr = draft.sections[sIdx].ingredients[iIdx];
      if(field==="amount") ingr.amount = inp.value.trim()==="" ? 0 : parseFloat(inp.value)||0;
      else if(field==="rangeMax") ingr.rangeMax = inp.value.trim()==="" ? null : (parseFloat(inp.value)||null);
      else if(field==="unit") ingr.unit = inp.value.trim();
      else if(field==="name") ingr.name = inp.value;
      persistEdits();
    });
  });

  viewEl.querySelectorAll(".edit-step-row textarea").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      const row = ta.closest(".edit-step-row");
      const sIdx = parseInt(row.dataset.sidx,10), stIdx = parseInt(row.dataset.stidx,10);
      draft.sections[sIdx].steps[stIdx].text = ta.value;
      persistEdits();
    });
  });

  viewEl.querySelectorAll("[data-remove-ing]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const [sIdx,iIdx] = b.dataset.removeIng.split(":").map(Number);
      draft.sections[sIdx].ingredients.splice(iIdx,1);
      persistEdits(); renderDetailView();
    });
  });
  viewEl.querySelectorAll("[data-remove-step]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const [sIdx,stIdx] = b.dataset.removeStep.split(":").map(Number);
      draft.sections[sIdx].steps.splice(stIdx,1);
      persistEdits(); renderDetailView();
    });
  });
  viewEl.querySelectorAll("[data-add-ing]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const sIdx = parseInt(b.dataset.addIng,10);
      draft.sections[sIdx].ingredients.push({name:"", amount:0, unit:"g", rangeMax:null});
      persistEdits(); renderDetailView();
    });
  });
  viewEl.querySelectorAll("[data-add-step]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const sIdx = parseInt(b.dataset.addStep,10);
      draft.sections[sIdx].steps.push({text:""});
      persistEdits(); renderDetailView();
    });
  });

  document.getElementById("edit-done").addEventListener("click", ()=>{
    State.editing = null;
    renderDetailView();
  });

  document.getElementById("edit-copy").addEventListener("click", (e)=>{
    const text = draftSummaryText(r.id);
    const btn = e.currentTarget;
    const done = ()=>{ const old=btn.innerHTML; btn.innerHTML="Copied!"; setTimeout(()=>{btn.innerHTML=old;},1400); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=>{ window.prompt("Copy this text:", text); });
    } else {
      window.prompt("Copy this text:", text);
    }
  });

  document.getElementById("edit-discard-all").addEventListener("click", ()=>{
    delete State.edits[r.id];
    persistEdits();
    State.editing = null;
    renderDetailView();
  });
}

function toggleMealPlan(id){
  const idx = State.mealPlan.indexOf(id);
  if(idx===-1) State.mealPlan.push(id); else State.mealPlan.splice(idx,1);
  persist();
}

/* ============================ INGREDIENT SEARCH ============================ */

function allIngredientNames(){
  const set = new Set();
  RECIPES.forEach(r=>r.sections.forEach(s=>s.ingredients.forEach(i=>set.add(i.name))));
  return Array.from(set);
}

function scoreRecipe(r, chips){
  const names = r.sections.flatMap(s=>s.ingredients.map(i=>i.name.toLowerCase()));
  let matched = 0, score = 0;
  const n = chips.length;
  chips.forEach((chip, idx)=>{
    const q = chip.toLowerCase();
    const hit = names.some(nm=>nm.includes(q));
    if(hit){ matched++; score += (n-idx)*10; }
  });
  return {matched, score, total:n};
}

function renderSearchView(){
  const chips = State.ingChips;
  const results = chips.length ? RECIPES.map(r=>({r, ...scoreRecipe(r, chips)}))
    .filter(x=>x.matched>0)
    .sort((a,b)=> b.score-a.score || a.r.title.localeCompare(b.r.title))
    : [];

  const chipsHtml = chips.map((c,idx)=>`
    <span class="ing-chip"><span class="num">${idx+1}</span>${esc(c)}<button data-remove="${idx}">${ICONS.x}</button></span>
  `).join("");

  viewEl.innerHTML = `
    <div class="chips-input-wrap">
      <div class="hint">Type the ingredients you have, in order of importance — press Enter after each.</div>
      <div class="chips-flex" id="chips-flex">
        ${chipsHtml}
        <input class="chip-input" id="ing-input" list="ing-datalist" placeholder="${chips.length?'Add another…':'e.g. chicken breast'}">
      </div>
      <datalist id="ing-datalist">${allIngredientNames().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    </div>
    <div class="match-list">
      ${
        !chips.length ? `<div class="empty-state"><span class="emoji">🔎</span><h3>Search by what's in your kitchen</h3><p>Add a few ingredients and I'll find recipes that use them — best matches first.</p></div>`
        : !results.length ? `<div class="empty-state"><span class="emoji">🤷‍♀️</span><h3>No matches</h3><p>None of your saved recipes use these ingredients yet.</p></div>`
        : results.map(({r,matched,total})=>`
          <a class="match-card" data-recipe="${r.id}">
            <div class="match-photo" style="background:${gradCss(primaryCat(r))}">${r.photo?`<img src="${esc(r.photo)}" alt="${esc(r.title)}">`:r.emoji}</div>
            <div class="match-info">
              <div class="match-name">${esc(r.title)}</div>
              <div class="match-sub">${matched===total?`<b>Has all ${total} ingredients</b>`:`Matches ${matched} of ${total} ingredients`}</div>
            </div>
            <div class="match-score"><div class="n">${matched}/${total}</div><div class="lbl">match</div></div>
          </a>`).join("")
      }
    </div>
  `;

  const input = document.getElementById("ing-input");
  input.addEventListener("keydown", (e)=>{
    if((e.key==="Enter" || e.key===",") && input.value.trim()){
      e.preventDefault();
      State.ingChips.push(input.value.trim());
      renderSearchView();
      const ni = document.getElementById("ing-input");
      ni.focus();
    } else if(e.key==="Backspace" && !input.value && State.ingChips.length){
      State.ingChips.pop();
      renderSearchView();
    }
  });
  input.focus();
  viewEl.querySelectorAll("[data-remove]").forEach(b=>{
    b.addEventListener("click", (e)=>{ e.stopPropagation(); State.ingChips.splice(parseInt(b.dataset.remove,10),1); renderSearchView(); });
  });
  viewEl.querySelectorAll(".match-card").forEach(el=>el.addEventListener("click", ()=>openRecipe(el.dataset.recipe)));
  window.onscroll = null;
}

/* ============================ MEAL PLAN ============================ */

function renderPlanView(){
  const items = State.mealPlan.map(id=>findRecipe(id)).filter(Boolean);
  viewEl.innerHTML = `
    <div class="plan-list" id="plan-list">
      ${items.length ? items.map((r,idx)=>`
        <div class="plan-item" data-id="${r.id}" data-idx="${idx}">
          <div class="plan-daynum">${idx+1}</div>
          <div class="plan-photo" style="background:${gradCss(primaryCat(r))}">${r.photo?`<img src="${esc(r.photo)}" alt="${esc(r.title)}">`:r.emoji}</div>
          <div class="plan-info">
            <div class="plan-name">${esc(r.title)}</div>
            <div class="plan-sub">${r.tags.join(" · ")}</div>
          </div>
          <button class="plan-remove" data-remove="${r.id}">${ICONS.x}</button>
          <div class="drag-handle" data-drag="${r.id}">${ICONS.handle}</div>
        </div>
      `).join("") : `<div class="empty-state"><span class="emoji">📋</span><h3>Nothing planned yet</h3><p>Open a recipe and tap the + button to add it to your plan for the next few days. Press and drag the handle here to reorder.</p></div>`}
    </div>
    ${items.length ? `<button class="fab-clear" id="plan-clear">Clear meal plan</button>` : ""}
  `;

  viewEl.querySelectorAll(".plan-info, .plan-photo, .plan-daynum").forEach(el=>{
    el.addEventListener("click", ()=>{
      const item = el.closest(".plan-item");
      if(item) openRecipe(item.dataset.id);
    });
  });
  viewEl.querySelectorAll("[data-remove]").forEach(b=>{
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      const id = b.dataset.remove;
      const idx = State.mealPlan.indexOf(id);
      if(idx>-1) State.mealPlan.splice(idx,1);
      persist(); renderPlanView(); renderTabbar();
    });
  });
  const clearBtn = document.getElementById("plan-clear");
  if(clearBtn) clearBtn.addEventListener("click", ()=>{ State.mealPlan=[]; persist(); renderPlanView(); renderTabbar(); });

  setupDragReorder();
  window.onscroll = null;
}

function setupDragReorder(){
  const list = document.getElementById("plan-list");
  if(!list) return;
  let dragEl=null, dragId=null, startY=0, ghostOffset=0, placeholderIdx=-1;

  list.querySelectorAll("[data-drag]").forEach(handle=>{
    handle.addEventListener("pointerdown", (e)=>{
      const item = handle.closest(".plan-item");
      dragEl = item; dragId = item.dataset.id;
      const rect = item.getBoundingClientRect();
      ghostOffset = e.clientY - rect.top;
      startY = e.clientY;
      item.classList.add("dragging");
      item.style.position="relative";
      item.setPointerCapture(e.pointerId);

      const move = (ev)=>{
        if(!dragEl) return;
        const dy = ev.clientY - startY;
        dragEl.style.transform = `translateY(${dy}px) scale(1.03)`;
        const items = Array.from(list.querySelectorAll(".plan-item"));
        items.forEach(it=>it.classList.remove("drop-target"));
        const pointerY = ev.clientY;
        let target=null;
        for(const it of items){
          if(it===dragEl) continue;
          const r = it.getBoundingClientRect();
          if(pointerY < r.top + r.height/2){ target = it; break; }
        }
        if(target){ target.classList.add("drop-target"); placeholderIdx = parseInt(target.dataset.idx,10); }
        else { placeholderIdx = items.length; }
      };
      const up = (ev)=>{
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        if(dragEl){
          dragEl.classList.remove("dragging");
          dragEl.style.transform="";
          const items = Array.from(list.querySelectorAll(".plan-item"));
          items.forEach(it=>it.classList.remove("drop-target"));
          const fromIdx = State.mealPlan.indexOf(dragId);
          let toIdx = placeholderIdx;
          if(toIdx===-1) toIdx = State.mealPlan.length;
          if(fromIdx>-1){
            State.mealPlan.splice(fromIdx,1);
            if(toIdx>fromIdx) toIdx--;
            State.mealPlan.splice(toIdx,0,dragId);
            persist();
          }
        }
        dragEl=null; dragId=null; placeholderIdx=-1;
        renderPlanView();
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    });
  });
}

/* ============================ INIT ============================ */
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

})();
</script>
